version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 15

    groups:
      # Major bumps often require both Stylelint
      # and the shared configurations to be updated
      # at the same time
      stylelint:
        patterns:
          - 'stylelint'
          - 'stylelint-*'
    
    schedule:
      interval: monthly
      time: '10:30'
      timezone: 'Europe/London'
      
    cooldown:
      default-days: 7
      
    versioning-strategy: increase

    # Bump package.json versions too
    # in addition to security updates
    allow:
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 15
    
    schedule:
      interval: monthly
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7
